[project]
name = "sparse-neurons"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10",
    "torch==2.6.0",
    "torchvision==0.21.0",
]

[project.scripts]
train-mnist-ard = "sparse_neurons.experiments.train_mnist:main"
train-mnist-baseline = "sparse_neurons.experiments.train_mnist_baseline:main"
evaluate-neuron-importance = "sparse_neurons.experiments.evaluate_neuron_importance:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
